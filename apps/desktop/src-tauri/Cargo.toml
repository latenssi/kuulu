[package]
name = "kuulu-desktop"
description = "Kuulu desktop client"
# The app version shown to users and the updater comes from ../package.json
# (see tauri.conf.json); the release workflow sets it from the git tag.
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4"
kuulu-audio = { path = "../../../crates/kuulu-audio" }
kuulu-client = { path = "../../../crates/kuulu-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
url = "2"
