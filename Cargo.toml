[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# Vendored, patched dependencies (see their PATCHES.md), and the cargo-fuzz
# targets, which need nightly (see fuzz/Cargo.toml).
exclude = ["third_party", "fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[patch.crates-io]
# macOS stop fix, see third_party/monio/PATCHES.md.
monio = { path = "third_party/monio" }
