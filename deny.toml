[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Keep the RUSTSEC ids in sync with .cargo/audit.toml.
ignore = [
    # zip 4.x via tauri-plugin-updater (newest 2.x release): built only on
    # Windows and used only for legacy .zip updater bundles, which we do not
    # ship; updates are signature-checked before extraction. Remove once the
    # plugin depends on zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater, not reachable" },
    { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater, not reachable" },
    { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater, not reachable" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained build-time dep of Tauri's GTK stack" },
    # zbus 5 crates merged into zbus 6; pulled by keyring's Secret Service
    # store (Linux). Remove once that store moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via keyring, merged into zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via keyring, merged into zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via keyring, merged into zbus 6" },
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # tiny-keccak (build-time, via tauri-plugin-deep-link's rust-ini).
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies (all crates are publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
