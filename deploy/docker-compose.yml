# Kuulu server. See docs/SERVER.md.
#   docker compose up -d
#   docker compose logs kuulu          # fingerprint and first admin invite
#   docker compose exec kuulu kuulu-server invite --uses 10 --expires 7d
services:
  kuulu:
    image: ghcr.io/latenssi/kuulu-server:latest
    restart: unless-stopped
    ports:
      - "7700:7700/udp"
    volumes:
      - kuulu:/data

volumes:
  kuulu:
