# Release pipeline, see docs/RELEASING.md.
#
# - Tag vX.Y.Z or vX.Y.Z-beta.N: build all platforms without the updater key,
#   then a separate job in the `release` environment signs the updater
#   artifacts with the locked Tauri CLI, writes latest.json and uploads
#   everything to a draft GitHub release.
# - Publishing that draft: copy its latest.json to the rolling `beta-channel`
#   release if it is newer than what is there. Beta users poll that feed.
# - Manual run (workflow_dispatch): build only; no key, nothing uploaded.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported glibc: AppImages run on distros at least this new.
          - os: ubuntu-22.04
            args: --bundles appimage
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
        working-directory: apps/desktop
      # The git tag is the single source of the release version.
      - if: github.ref_type == 'tag'
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # OS-level code signing is optional until certificates exist.
      - name: macOS signing (ad-hoc unless Apple secrets are set)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          delim="EOF_$(openssl rand -hex 16)"
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<%s\n%s\n%s\n' "$v" "$delim" "${!v}" "$delim" >> "$GITHUB_ENV"
          done
      - name: Windows Authenticode (only if a certificate secret is set)
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $conf = (Join-Path $env:RUNNER_TEMP sign.conf.json) -replace '\\', '/'
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content $conf
          "args=--config $conf" >> $env:GITHUB_OUTPUT

      # No updater key here: build scripts and npm packages never see it.
      - name: Build
        working-directory: apps/desktop
        run: npm run tauri -- build ${{ matrix.args }} ${{ steps.wincert.outputs.args }}
      # Collect the installers; the AppImage, the .app.tar.gz and the NSIS
      # setup.exe double as updater artifacts.
      - name: Collect bundles
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          mkdir out
          case "$RUNNER_OS" in
            Linux) cp target/release/bundle/appimage/*.AppImage out/ ;;
            macOS)
              bundle=target/universal-apple-darwin/release/bundle
              cp "$bundle"/dmg/*.dmg out/
              COPYFILE_DISABLE=1 tar -czf "out/Kuulu_${version}_universal.app.tar.gz" \
                -C "$bundle/macos" Kuulu.app ;;
            Windows) cp target/release/bundle/nsis/*-setup.exe out/ ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ runner.os }}
          path: out/
          if-no-files-found: error

  # Holds the updater key. Runs only the locked Tauri CLI, jq and gh.
  sign:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: out
      - name: Sign updater artifacts and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          tauri=apps/desktop/node_modules/.bin/tauri
          cd out
          linux=$(ls *.AppImage) mac=$(ls *.app.tar.gz) win=$(ls *-setup.exe)
          for f in "$linux" "$mac" "$win"; do
            # --app-version binds the version for requireSignedVersion.
            "../$tauri" signer sign --app-version "$version" "$f"
          done
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() { jq -n --arg url "$base/$1" --rawfile sig "$1.sig" '{url: $url, signature: $sig}'; }
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson linux "$(entry "$linux")" --argjson mac "$(entry "$mac")" \
            --argjson win "$(entry "$win")" \
            '{version: $version, pub_date: $date, platforms: {
              "linux-x86_64": $linux, "darwin-x86_64": $mac,
              "darwin-aarch64": $mac, "windows-x86_64": $win}}' > latest.json
          cat latest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-beta.* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
            --title "Kuulu ${TAG#v}" --generate-notes out/*

  beta-channel:
    # Only releases this workflow drafted (author: github-actions[bot]).
    if: >-
      github.event_name == 'release'
      && startsWith(github.event.release.tag_name, 'v')
      && github.event.release.author.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency: beta-channel
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir new
          if ! gh release view beta-channel > /dev/null 2>&1; then
            gh release create beta-channel --prerelease --target main \
              --title "Beta update channel" \
              --notes "Updater feed for beta builds (see docs/RELEASING.md). Do not delete."
          fi
          if gh release download beta-channel --pattern latest.json --dir current; then
            new=$(jq -r .version new/latest.json) current=$(jq -r .version current/latest.json)
            # Semver order for our tag forms X.Y.Z and X.Y.Z-beta.N.
            if ! node -e '
              const key = v => {
                const m = /^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/.exec(v);
                if (!m) throw new Error(`unexpected version ${v}`);
                return [+m[1], +m[2], +m[3], m[4] === undefined ? Infinity : +m[4]];
              };
              const [a, b] = process.argv.slice(1).map(key);
              const i = a.findIndex((x, j) => x !== b[j]);
              process.exit(i >= 0 && a[i] > b[i] ? 0 : 1);
            ' "$new" "$current"; then
              echo "beta-channel already has $current, not replacing with $new"
              exit 0
            fi
          fi
          gh release upload beta-channel new/latest.json --clobber
