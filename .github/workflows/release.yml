# Release pipeline, see docs/RELEASING.md.
#
# - Tag vX.Y.Z or vX.Y.Z-beta.N: build all platforms, sign updater artifacts
#   and upload them with latest.json to a draft GitHub release.
# - Publishing that draft: copy its latest.json to the rolling `beta-channel`
#   release, which beta builds poll for updates.
# - Manual run (workflow_dispatch): build only, nothing is uploaded.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          [[ "$TAG" == *-beta.* ]] && prerelease=true
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Kuulu ${TAG#v}" \
            -F draft=true -F prerelease=$prerelease -F generate_release_notes=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    if: ${{ !failure() && !cancelled() && github.event_name != 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported glibc: AppImages run on distros at least this new.
          - os: ubuntu-22.04
            args: --bundles appimage
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/desktop
      # The git tag is the single source of the release version.
      - if: github.ref_type == 'tag'
        working-directory: apps/desktop
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # OS-level code signing is optional until certificates exist.
      - name: macOS signing (ad-hoc unless Apple secrets are set)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
      - name: Windows Authenticode (only if a certificate secret is set)
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $conf = (Join-Path $env:RUNNER_TEMP sign.conf.json) -replace '\\', '/'
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content $conf
          "args=--config $conf" >> $env:GITHUB_OUTPUT

      # Without releaseId/tagName (manual runs) tauri-action only builds.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          args: ${{ matrix.args }} ${{ steps.wincert.outputs.args }}

  beta-channel:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern latest.json
          if ! gh release view beta-channel > /dev/null 2>&1; then
            gh release create beta-channel --prerelease --target main \
              --title "Beta update channel" \
              --notes "Updater feed for beta builds (see docs/RELEASING.md). Do not delete."
          fi
          gh release upload beta-channel latest.json --clobber
